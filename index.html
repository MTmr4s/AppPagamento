<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EAF0E3">
<title>Caderninho de Fiado</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --paper:#EAF0E3;
  --line:#B7CAAC;
  --ink:#2B2A24;
  --ink-soft:#73715F;
  --card:#F7F5EC;
  --stamp:#B23A2E;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; min-height:100vh;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 35px,
      rgba(183,202,172,0.55) 36px
    ),
    var(--paper);
  color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  overscroll-behavior:none;
}

.margin-line{
  position:fixed; top:0; bottom:0; left:18px; width:1px;
  background:rgba(178,58,46,0.28); z-index:0; pointer-events:none;
}

.app{ position:relative; z-index:1; padding-left:30px; padding-right:18px; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

header{
  position:sticky; top:0; z-index:5;
  padding-top:calc(22px + env(safe-area-inset-top));
  padding-bottom:14px;
  padding-left:30px; padding-right:18px;
  margin-left:-30px; margin-right:-18px;
  background:linear-gradient(var(--paper) 80%, transparent);
}
.title{ font-family:'Caveat',cursive; font-weight:700; font-size:42px; line-height:1; color:var(--ink); margin:0; }
.subtitle{ font-family:'Caveat',cursive; font-weight:600; font-size:17px; color:var(--ink-soft); margin:2px 0 14px; }

.balance-row{ display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--line); padding-bottom:12px; }
.balance-label{ font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.08em; }
.balance-value{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:26px; color:var(--stamp); }

.tabs{ display:flex; gap:0; margin-top:14px; border-bottom:1px solid var(--line); }
.tab{ flex:1; text-align:center; padding:9px 0; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:3px solid transparent; user-select:none; }
.tab.active{ color:var(--ink); border-bottom-color:var(--stamp); }
.tab.disabled{ opacity:0.4; pointer-events:none; }
.tabs.mini{ margin-top:2px; }

.backup-row{ display:flex; justify-content:flex-end; gap:16px; padding:10px 0 0; }
.backup-row button{ background:none; border:none; font-size:12px; color:var(--ink-soft); cursor:pointer; padding:0; text-decoration:underline; font-family:inherit; }

main{ flex:1; padding-bottom:120px; }

.entry{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); gap:10px; cursor:pointer; }
.entry-info{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.entry-name{ font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.entry-date{ font-size:12px; color:var(--ink-soft); }
.entry-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.entry-value{ font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600; color:var(--stamp); }

.stamp{
  font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; letter-spacing:0.1em;
  color:var(--stamp); border:2px solid var(--stamp); padding:2px 7px; border-radius:4px;
  transform:rotate(-8deg); display:inline-block; opacity:0.85; white-space:nowrap;
}

.del-btn{ background:none; border:none; color:var(--ink-soft); font-size:18px; line-height:1; padding:4px 2px; cursor:pointer; }

.empty{ text-align:center; padding:60px 10px; color:var(--ink-soft); font-size:14px; }
.empty span{ display:block; font-family:'Caveat',cursive; font-size:24px; color:var(--ink); margin-bottom:6px; }

.fab{
  position:fixed; right:20px; bottom:calc(24px + env(safe-area-inset-bottom));
  width:56px; height:56px; border-radius:50%; background:var(--ink); color:var(--paper);
  font-size:28px; border:none; box-shadow:0 6px 16px rgba(43,42,36,0.35); cursor:pointer;
  display:flex; align-items:center; justify-content:center; z-index:10;
}

.overlay{ position:fixed; inset:0; background:rgba(43,42,36,0.35); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s; }
.overlay.show{ opacity:1; pointer-events:auto; }

.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--card);
  border-radius:18px 18px 0 0; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform .25s ease-out; box-shadow:0 -8px 24px rgba(0,0,0,0.15);
  max-height:85vh; overflow-y:auto;
}
.sheet.show{ transform:translateY(0); }
.sheet h2{ font-family:'Caveat',cursive; font-size:28px; margin:0 0 4px; color:var(--ink); }
.saldo-info{ font-size:14px; color:var(--ink-soft); margin:0 0 14px; }
.saldo-info strong{ color:var(--stamp); font-family:'IBM Plex Mono',monospace; }
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.05em; }
.field input{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px;
  font-size:16px; background:var(--paper); color:var(--ink); font-family:inherit;
}
.field input.error{ border-color:var(--stamp); }
.quick-fill{
  display:inline-block; background:none; border:none; color:var(--stamp); font-size:13px;
  font-weight:600; text-decoration:underline; cursor:pointer; padding:0 0 14px; font-family:inherit;
}
.sheet-actions{ display:flex; gap:10px; margin-top:4px; }
.sheet-actions button{ flex:1; padding:12px; border-radius:10px; font-size:15px; font-weight:600; border:none; cursor:pointer; }
.btn-cancel{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line) !important; }
.btn-save{ background:var(--ink); color:var(--paper); }
.del-link{ display:block; width:100%; text-align:center; background:none; border:none; color:var(--ink-soft); font-size:13px; margin-top:18px; cursor:pointer; text-decoration:underline; font-family:inherit; }
</style>
</head>
<body>
<div class="margin-line"></div>
<div class="app">
  <header>
    <h1 class="title">Caderninho</h1>
    <p class="subtitle">seu controle de fiado, sem enrolação</p>
    <div class="balance-row">
      <span class="balance-label">Em aberto</span>
      <span class="balance-value" id="balance">R$ 0,00</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-filter="aberto">Em aberto</div>
      <div class="tab" data-filter="pago">Pago</div>
      <div class="tab" data-filter="todos">Todos</div>
    </div>
    <div class="backup-row">
      <button id="btn-export" type="button">Exportar backup</button>
      <button id="btn-import" type="button">Importar backup</button>
      <input type="file" id="file-import" accept="application/json" style="display:none">
    </div>
  </header>
  <main id="list"></main>
</div>

<button class="fab" id="fab" aria-label="Adicionar compra">+</button>

<div class="overlay" id="overlay"></div>

<div class="sheet" id="sheet-new">
  <h2>Nova compra</h2>
  <div class="field">
    <label for="input-nome">Nome</label>
    <input id="input-nome" type="text" placeholder="Quem comprou" autocomplete="off" list="clientes-datalist">
    <datalist id="clientes-datalist"></datalist>
  </div>
  <div class="field">
    <label for="input-valor">Valor (R$)</label>
    <input id="input-valor" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00">
  </div>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btn-cancel-new">Cancelar</button>
    <button class="btn-save" id="btn-save-new">Salvar</button>
  </div>
</div>

<div class="sheet" id="sheet-action">
  <h2 id="action-title">Nome</h2>
  <p class="saldo-info">Saldo atual: <strong id="action-saldo">R$ 0,00</strong></p>
  <div class="tabs mini" id="action-mode-tabs">
    <div class="tab" data-mode="pagamento">Pagamento</div>
    <div class="tab" data-mode="compra">Nova compra</div>
  </div>
  <div class="field" style="margin-top:14px;">
    <label for="action-valor-input">Valor (R$)</label>
    <input id="action-valor-input" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="0,00">
  </div>
  <button class="quick-fill" id="btn-pagar-tudo" type="button">Pagar tudo</button>
  <div class="sheet-actions">
    <button class="btn-cancel" id="btn-cancel-action">Cancelar</button>
    <button class="btn-save" id="btn-confirm-action">Confirmar</button>
  </div>
  <button class="del-link" id="btn-delete-cliente" type="button">Excluir cliente</button>
</div>

<script>
const STORAGE_KEY = 'fiado-clientes';
let clientes = [];
let filter = 'aberto';
let currentClientId = null;
let actionMode = 'pagamento';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayISO(){
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
}
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return d+'/'+m;
}
function formatCurrency(v){
  return Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function round2(n){
  return Math.round(n*100)/100;
}

function loadClientes(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    clientes = raw ? JSON.parse(raw) : [];
  }catch(e){
    clientes = [];
  }
  render();
}

function saveClientes(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clientes));
  }catch(e){
    console.error('Erro ao salvar', e);
  }
}

function getFiltered(){
  let list = clientes.slice();
  if(filter === 'aberto') list = list.filter(c => c.saldo > 0);
  else if(filter === 'pago') list = list.filter(c => c.saldo === 0);
  list.sort((a,b) => (b.lastUpdate || '').localeCompare(a.lastUpdate || ''));
  return list;
}

function getBalance(){
  return clientes.filter(c => c.saldo > 0).reduce((s,c) => s + Number(c.saldo), 0);
}

function emptyMessage(){
  if(filter === 'aberto') return ['Tudo certo por aqui', 'Nenhum fiado em aberto.'];
  if(filter === 'pago') return ['Nada por aqui ainda', 'Ninguém quitou ainda.'];
  return ['Caderninho vazio', 'Toque no + para lançar a primeira compra.'];
}

function render(){
  document.getElementById('balance').textContent = formatCurrency(getBalance());
  document.querySelectorAll('header > .tabs > .tab').forEach(t => t.classList.toggle('active', t.dataset.filter === filter));

  const list = getFiltered();
  const container = document.getElementById('list');

  if(list.length === 0){
    const [h, p] = emptyMessage();
    container.innerHTML = `<div class="empty"><span>${h}</span>${p}</div>`;
    return;
  }

  container.innerHTML = list.map(c => {
    const isPago = c.saldo === 0;
    const rightHtml = isPago
      ? `<span class="stamp">PAGO</span>`
      : `<span class="entry-value">${formatCurrency(c.saldo)}</span>`;
    return `
      <div class="entry" data-id="${c.id}">
        <div class="entry-info">
          <span class="entry-name">${escapeHtml(c.nome)}</span>
          <span class="entry-date">atualizado ${formatDate(c.lastUpdate)}</span>
        </div>
        <div class="entry-right">
          ${rightHtml}
          <button class="del-btn" data-id="${c.id}" data-action="delete">×</button>
        </div>
      </div>
    `;
  }).join('');
}

document.getElementById('list').addEventListener('click', (ev) => {
  const delBtn = ev.target.closest('[data-action="delete"]');
  if(delBtn){
    deleteCliente(delBtn.dataset.id);
    return;
  }
  const row = ev.target.closest('.entry');
  if(row) openActionSheet(row.dataset.id);
});

function deleteCliente(id){
  const c = clientes.find(x => x.id === id);
  if(!c) return;
  const ok = confirm(`Excluir "${c.nome}"? Isso remove o histórico dele.`);
  if(!ok) return;
  clientes = clientes.filter(x => x.id !== id);
  saveClientes();
  render();
}

document.querySelectorAll('header > .tabs > .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    filter = tab.dataset.filter;
    render();
  });
});

// ---- sheet: nova compra (FAB) ----
const sheetNew = document.getElementById('sheet-new');
const overlay = document.getElementById('overlay');
const fab = document.getElementById('fab');
const inputNome = document.getElementById('input-nome');
const inputValor = document.getElementById('input-valor');
const datalist = document.getElementById('clientes-datalist');

function openNewSheet(){
  inputNome.value = '';
  inputValor.value = '';
  inputNome.classList.remove('error');
  inputValor.classList.remove('error');
  datalist.innerHTML = clientes.map(c => `<option value="${escapeHtml(c.nome)}">`).join('');
  sheetNew.classList.add('show');
  overlay.classList.add('show');
  overlay.dataset.target = 'new';
  setTimeout(() => inputNome.focus(), 250);
}
function closeAllSheets(){
  sheetNew.classList.remove('show');
  document.getElementById('sheet-action').classList.remove('show');
  overlay.classList.remove('show');
}

fab.addEventListener('click', openNewSheet);
overlay.addEventListener('click', closeAllSheets);
document.getElementById('btn-cancel-new').addEventListener('click', closeAllSheets);

document.getElementById('btn-save-new').addEventListener('click', () => {
  const nome = inputNome.value.trim();
  const valor = parseFloat(inputValor.value);

  let valid = true;
  if(!nome){ inputNome.classList.add('error'); valid = false; } else { inputNome.classList.remove('error'); }
  if(!valor || valor <= 0){ inputValor.classList.add('error'); valid = false; } else { inputValor.classList.remove('error'); }
  if(!valid) return;

  const existing = clientes.find(c => c.nome.trim().toLowerCase() === nome.toLowerCase());
  if(existing){
    existing.saldo = round2(existing.saldo + valor);
    existing.lastUpdate = todayISO();
  }else{
    clientes.push({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
      nome, saldo: round2(valor), lastUpdate: todayISO()
    });
  }
  saveClientes();
  closeAllSheets();
  render();
});

// ---- sheet: ação (pagamento / nova compra num cliente existente) ----
const sheetAction = document.getElementById('sheet-action');
const actionValorInput = document.getElementById('action-valor-input');
const actionModeTabs = document.querySelectorAll('#action-mode-tabs .tab');
const btnPagarTudo = document.getElementById('btn-pagar-tudo');

function openActionSheet(id){
  const c = clientes.find(x => x.id === id);
  if(!c) return;
  currentClientId = id;
  document.getElementById('action-title').textContent = c.nome;
  document.getElementById('action-saldo').textContent = formatCurrency(c.saldo);
  actionValorInput.value = '';
  actionValorInput.classList.remove('error');

  const pagamentoTab = document.querySelector('#action-mode-tabs .tab[data-mode="pagamento"]');
  if(c.saldo > 0){
    pagamentoTab.classList.remove('disabled');
    actionMode = 'pagamento';
  }else{
    pagamentoTab.classList.add('disabled');
    actionMode = 'compra';
  }
  updateActionModeUI();

  sheetAction.classList.add('show');
  overlay.classList.add('show');
  setTimeout(() => actionValorInput.focus(), 250);
}

function updateActionModeUI(){
  actionModeTabs.forEach(t => t.classList.toggle('active', t.dataset.mode === actionMode));
  const c = clientes.find(x => x.id === currentClientId);
  if(actionMode === 'pagamento' && c){
    btnPagarTudo.style.display = 'inline-block';
    btnPagarTudo.textContent = `Pagar tudo (${formatCurrency(c.saldo)})`;
  }else{
    btnPagarTudo.style.display = 'none';
  }
}

actionModeTabs.forEach(t => {
  t.addEventListener('click', () => {
    if(t.classList.contains('disabled')) return;
    actionMode = t.dataset.mode;
    updateActionModeUI();
  });
});

btnPagarTudo.addEventListener('click', () => {
  const c = clientes.find(x => x.id === currentClientId);
  if(c) actionValorInput.value = c.saldo.toFixed(2);
});

document.getElementById('btn-cancel-action').addEventListener('click', closeAllSheets);

document.getElementById('btn-confirm-action').addEventListener('click', () => {
  const valor = parseFloat(actionValorInput.value);
  if(!valor || valor <= 0){ actionValorInput.classList.add('error'); return; }
  actionValorInput.classList.remove('error');

  const c = clientes.find(x => x.id === currentClientId);
  if(!c) return;

  if(actionMode === 'pagamento'){
    c.saldo = Math.max(0, round2(c.saldo - valor));
  }else{
    c.saldo = round2(c.saldo + valor);
  }
  c.lastUpdate = todayISO();
  saveClientes();
  closeAllSheets();
  render();
});

document.getElementById('btn-delete-cliente').addEventListener('click', () => {
  if(currentClientId){
    closeAllSheets();
    deleteCliente(currentClientId);
  }
});

// ---- backup ----
function exportBackup(){
  const data = JSON.stringify(clientes, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fiado-backup-${todayISO()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('formato inválido');
      const ok = confirm(`Importar ${imported.length} cliente(s)? Isso substitui os dados atuais.`);
      if(!ok) return;
      clientes = imported;
      saveClientes();
      render();
    }catch(err){
      alert('Arquivo inválido. Selecione um backup exportado por este app.');
    }
  };
  reader.readAsText(file);
}

document.getElementById('btn-export').addEventListener('click', exportBackup);
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('file-import').click());
document.getElementById('file-import').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(file) importBackup(file);
  e.target.value = '';
});

loadClientes();
</script>
</body>
</html>
